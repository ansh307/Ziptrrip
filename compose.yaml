services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile

    container_name: Ziptrrip-Frontend

    ports:
      - "80:80"

    restart: unless-stopped
  
  backend:
    build: 
      context: ./Backend
      dockerfile: Dockerfile

    container_name: Ziptrrip-Backend

    ports:
      - "3000:3000"

    env_file:
      - ./Backend/.env

    restart: unless-stopped