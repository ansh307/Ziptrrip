services:
  frontend:
    image: anshjz/ziptrrip-frontend:latest

    ports:
      - "80:80"

    env_file:
      - .env

    depends_on:
      - backend

  backend:
    image: anshjz/ziptrrip-backend:latest

    expose:
      - "3000"

    env_file:
      - .env

    depends_on:
      - mongodb

  mongodb:
    image: mongo:8

volumes:
  mongo-data:
