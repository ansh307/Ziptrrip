name: Ziptrrip CI

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json

      ####################################################
      # Frontend
      ####################################################

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: ./Frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: ./Frontend
        run: npm run build

      ####################################################
      # Backend
      ####################################################

      - name: Install Backend Dependencies
        working-directory: ./Backend
        run: npm ci

      - name: Lint Backend
        working-directory: ./Backend
        run: npm run lint --if-present

      ####################################################
      # Docker
      ####################################################

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      ####################################################
      # Docker Build images and push to Docker hub
      ####################################################

      # - name: Build Frontend Docker Image
      #   run: |
      #     docker build -t ziptrrip-frontend ./Frontend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            --build-arg VITE_APP_API_URL=${{ secrets.VITE_APP_API_URL }} \
            -t ziptrrip-frontend ./Frontend

      - name: Build Backend Docker Image
        run: |
          docker build -t ziptrrip-backend ./Backend

      - name: Tag Docker Images
        run: |
          docker tag ziptrrip-frontend ${{ secrets.DOCKERHUB_USERNAME }}/ziptrrip-frontend:latest
          docker tag ziptrrip-backend ${{ secrets.DOCKERHUB_USERNAME }}/ziptrrip-backend:latest

      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ziptrrip-frontend:latest

      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/ziptrrip-backend:latest

      #################################################
      # Deploy
      #################################################

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}

          script: |
            cd ~/ziptrrip

            docker compose pull

            docker compose up -d

            docker image prune -f
